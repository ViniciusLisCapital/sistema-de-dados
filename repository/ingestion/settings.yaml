    decode_shift: 3
    reason: "text layer Caesar-shifted by 3 (font encoding, \"wkh\" for \"the\"; common-word share 0.001 before decoding); pymupdf for the equations. The References cut stops at the first figure caption (Fig 1), so the captions of Fig 1-6 survive (cleaner fix 2026-10-19)"

