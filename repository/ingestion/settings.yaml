# What the ingestion pipeline remembers between runs. Read by repository/ingestion/scripts/settings.py.
#
# files: per-PDF entries, keyed by file name. Written only when the default extraction
#   (mode plumber, x_tolerance 1.5, decode_shift 0) does not work, or with
#   `status: needs_attention` for a file the tools cannot ingest. Always with the reason.
#   Modes and what each fixes: repository/ingestion/scripts/extract.py.
# topics_on_hold: topics the sweep reports but never ingests.

