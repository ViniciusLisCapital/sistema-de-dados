      reference_period, not the release month. MDIC also publishes weekly preliminary
      "parcial" figures within each month (not listed here, see source for the full
      schedule) and the calendar is fully published through Dec 2026.
    source_url: https://balanca.economia.gov.br/balanca/cronograma/pg_cronograma.html
