      the external-sector note, a day earlier, and is listed there too (see that group's
      note, which also records why the IBC-Br release is NOT what extends it). It stays
      duplicated here so a credit-only refresh can never miss the denominator. Leaving it out
      silently truncated the credit-impulse metric by one month: the formula needs GDP at
