    release_time_tz: America/New_York
    note: >
      Two-day meeting; the rate decision is announced on day 2 at ~14:00 ET. `date` is
      day 2, `date_start` is day 1. Read directly off the Fed's own published calendar,
      so these are genuinely confirmed (unlike Copom's, which BCB doesn't expose).
      Matters here because `diferenciais_juros` tracks the Selic–Fed Funds spread, so
      both central banks' decision dates move that series. Sep and Dec coincide exactly
      with Copom's meetings this year; Oct does not (Copom meets Nov 3-4 instead).
      Sep/Dec also carry a Summary of Economic Projections (SEP); Oct does not.
      Minutes are published 3 weeks after each meeting (not itemized here).
    source_url: https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm
    entries:
