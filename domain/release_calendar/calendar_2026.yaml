      next business day after MTE's own release. Dates below are derived from that
      group's confirmed dates, not independently confirmed for the SGS mirror itself.
    source_url: https://www.gov.br/trabalho-e-emprego/pt-br/acesso-a-informacao/acoes-e-programas/programas-projetos-acoes-obras-e-atividades/estatisticas-trabalho/o-pdet/calendario-de-divulgacao-do-novo-caged
