  - group: bea_pce
    institution: "BEA"
    name: "Personal Income and Outlays (PCE)"
    tables: [inflc_pce, inflc_pce_dim]
    cadence: monthly
    release_time: "08:30"
    release_time_tz: America/New_York
    note: >
      O PCE nao tem divulgacao propria: sai dentro do release "Personal Income and
      Outlays" do BEA, e e por isso que o `match` e o titulo do release e nao o nome
      do indice. Datas e horas do feed ICS do BEA, que traz o periodo de referencia no
      proprio titulo do evento ("Personal Income and Outlays, August 2026") -- por
      isso, ao contrario do BLS, aqui o ICS basta. Conferidas contra a pagina de
      agenda do BEA e contra o release 54 do FRED (as tres batiam em 2026-08-26).
      A agenda de 2026 e IRREGULAR no comeco do ano (22/01 as 10:00 para o dado de
      novembro, depois 20/02, 13/03, 09/04 e 30/04 -- duas divulgacoes em abril, para
      recuperar o atraso), o que e a razao concreta de as datas serem lidas da fonte
      em vez de derivadas de uma regra de dia do mes. A agenda vai ate dez/2026;
      2027 nao existia em 2026-08-26.
      Como no bls_cpi, a dimensao entra no grupo para o botao rodar a cadeia inteira.
      Aqui a ordem alfabetica poe a serie antes da arvore, e o que se perde e a
      validacao PREVIA da estrutura (`inflc_pce_dim` levantaria antes de qualquer valor
      ser gravado se o BEA reorganizasse a tabela); rodando depois, ela ainda levanta,
      so que com a serie ja escrita. `jobs/update_us.py` continua sendo o caminho com a
      ordem certa.
