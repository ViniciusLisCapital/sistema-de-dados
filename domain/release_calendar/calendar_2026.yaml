      - {date: "2026-09-29", date_end: "2026-09-30", reference_period: "2026-08", confirmed: false}
      - {date: "2026-10-29", date_end: "2026-10-30", reference_period: "2026-09", confirmed: false}
      - {date: "2026-11-30", date_end: "2026-12-01", reference_period: "2026-10", confirmed: false}
      - {date: "2026-12-30", date_end: "2026-12-31", reference_period: "2026-11", confirmed: false}

