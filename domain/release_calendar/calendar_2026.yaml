# Forward-looking release calendar for Brazilian macro data, Aug-Dec 2026.
#
# One entry per official release EVENT, not per series -- BCB in particular bundles
# dozens of series into a single monthly "nota". See this folder's CLAUDE.md for the
# schema, per-group confidence notes, and what's deliberately NOT covered yet
# (international-sourced series, a few untouched BCB SGS series).
#
# confirmed: true  -> date read directly from an official published calendar/PDF/ICS feed.
# confirmed: false -> no exact date could be retrieved (source page was a JS-rendered
#                      SPA or returned an HTTP error as of 2026-08-13) -- date/window
#                      is an estimate from the historical day-of-month pattern.
#                      Re-check the source_url closer to the date before relying on it.
#
# Researched 2026-08-13. Only dates on/after that day are listed (nothing in the past).
#
# UPDATED 2026-08-17: every BCB group here is now confirmed:true, sourced from BCB's own
# release-calendar ICS feeds (/api/exportarics/sitebcb/agendaics?lista=<Nome>) and parsed
# raw rather than summarized. That endpoint's full list of 29 available `lista` values is
# itself enumerable -- see this folder's CLAUDE.md, point 4, for how to rediscover it.
# This retired every derived-rule estimate for the BCB monthly notes and added two groups
# (bcb_icbr, plus itemized bcb_focus dates). Remaining confirmed:false groups are the two
# CAGED ones only, which are not BCB-sourced.

# Tables with NO release event, on purpose -- read by domain/release_calendar/sync.py,
# which would otherwise report them as uncovered. Two kinds: continuous market series
# (a new observation every trading day, no discrete announcement to point at) and tables
# that aren't published series at all (a dimension table, model parameters).
#
# This has to be DECLARED rather than inferred from "has no group": if absence of a group
# silently meant "needs no calendar", a genuine coverage gap would be indistinguishable
# from a deliberate exclusion -- which is exactly the confusion the --coverage audit in
# this folder's CLAUDE.md had to be triaged by hand to resolve.
#
# Separado por MOTIVO, nao numa lista so: as duas metades tem consumidor diferente.
# `continuous` e o que `jobs/update_db.py --continuous` roda todo dia sem calendario;
# `not_a_series` nao roda por calendario nem por dia, so quando algo mudar a mao.
no_release:
  # Serie continua de mercado: um dado novo por dia util, sem anuncio para apontar.
  # Criterio para entrar aqui: run() busca da fonte sozinho. Por isso cmb_risco_pais
  # NAO esta na lista, apesar de ser serie de mercado -- o run() dele le CSVs
  # exportados a mao do investing.com (CDS 5Y e serie paga), entao um job diario nao
  # traria dado novo nenhum.
  continuous:
    - cmb_ptax               # PTAX + volume interbancario, diario
    - cmb_dollar_index       # DXY, diario
    - cmb_dollar_index_em    # indice do dolar vs. EM, diario
    - cmb_fx_latam           # cambio MX/CL/CO/PE, diario
    - cmb_equity_us          # equity US, diario
    - comm_brent             # Brent, diario
    - cmb_policy_rates       # policy rate BIS (BR/MX/CL/CO/PE/AR), diaria
  # Nao e serie divulgada: nada a esperar do calendario e nada a rodar por dia.
  not_a_series:
    - inflc_dim              # tabela de dimensao (IPCA)
    - inflc_cpi_dim          # dimensao do CPI dos EUA (as 2 arvores publicadas)
    - inflc_pce_dim          # dimensao do PCE dos EUA (arvore das tabelas 2.4.xU)
    # Importancia relativa do CPI: snapshot ANUAL de dezembro, publicado junto com o
    # CPI de janeiro. Entra aqui e nao como grupo proprio por um motivo mecanico, nao
    # de escopo: a tabela e chaveada por `reference_period`/`weights_year` e NAO TEM a
    # coluna `date`, entao a checagem do sync.py (MAX(date) >= periodo esperado) nao
    # tem em que se apoiar. Pendura-la no grupo mensal bls_cpi produziria ATRASADO
    # onze meses por ano, que e ruido, nao informacao.
    - inflc_cpi_pesos

# Tolerancia de atraso para conteudo DIARIO -- a checagem que faltava.
#
# Uma tabela diaria nao tem "periodo de referencia" para comparar: a pergunta certa
# nao e "ja saiu o dado de julho?" e sim "quao velho esta o ultimo ponto em relacao a
# HOJE?". Sem isso, uma serie diaria pendurada num grupo mensal passa a checagem com
# semanas de atraso -- basta MAX(date) estar depois do periodo da nota mensal.
#
# Isso NAO era teorico. Descoberto 2026-08-19, quando o BCB divulgou fluxo cambial e a
# checagem dizia OK: cmb_cambio_contratado estava em 2026-07-24 com o SGS ja em
# 08-14 (3 semanas), e cmb_reservas_bc em 08-03 com o SGS em 08-18 (2 semanas). As
# duas cobradas contra a nota mensal do setor externo (referencia 2026-06), que
# qualquer coisa recente satisfaz. Mesma classe do buraco do expc_focus, agora com
# duas vitimas confirmadas -- por isso virou regra generica em vez de override caso a caso.
#
# As 7 primeiras tambem estao em `no_release.continuous` acima, e isso nao e
# redundancia: la elas declaram "nao tem evento de divulgacao", aqui declaram "e este
# o atraso tolerado". Antes deste bloco, as continuas eram SEM DIVULGACAO e portanto
# NAO eram checadas por nada -- se o job diario parasse, ninguem notaria.
#
# `jobs/update_db.py --continuous` roda a UNIAO deste bloco com no_release.continuous,
# entao as duas ultimas entram no passe diario (o que as mantem em dia) sem sair do
# calendario (o que as mantem checadas).
#
# Folga = lag DE PUBLICACAO da fonte + ~4 dias (fim de semana + feriado). Nao aperte
# para 1-2 dias: geraria atraso falso em toda segunda-feira.
#
# Os valores abaixo foram MEDIDOS, nao estimados: em 2026-08-19, logo depois de um
# `--continuous` que terminou 9/9 OK, mediu-se `hoje - MAX(date)` de cada tabela --
# com tudo recem-atualizado, o que sobra e o atraso da propria fonte. O primeiro chute
# subestimou tres (dollar_index_em, policy_rates, cambio_contratado); os valores atuais
# vem da medicao. Re-medir com o mesmo metodo se aparecer atraso falso.
max_age_days:
  cmb_ptax: 5                 # lag medido 0d (BCB publica no mesmo dia)
  cmb_dollar_index: 5         # lag medido 0d
  # 12, nao 9: a tolerancia tem que cobrir o INTERVALO ENTRE DIVULGACOES, nao o lag
  # medido uma vez. Estas duas sao serie DIARIA divulgada SEMANALMENTE, e nesse
  # arranjo a idade do ultimo ponto anda de ~3 dias (dia da divulgacao) a ~10 (vespera
  # da seguinte). Os 9 vinham de uma medicao unica do lag e davam ATRASADO falso toda
  # segunda-feira -- confirmado em 2026-08-24, quando as duas apareceram atrasadas e a
  # fonte foi consultada ao vivo: SGS 13961 terminava em 14/08 e o DTWEXEMEGS tambem
  # (last_updated 2026-08-17), ou seja, nao havia dado novo para buscar.
  cmb_dollar_index_em: 12     # H.10 do Fed, toda segunda, cobrindo ate a sexta anterior
  cmb_fx_latam: 5             # lag medido 0d
  cmb_equity_us: 5            # lag medido 0d
  comm_brent: 8               # lag medido 1d
  cmb_policy_rates: 12        # lag medido 8d -- BIS republica em lote, o maior de todos
  # Tem divulgacao mensal E conteudo diario -- checadas pelas duas regras
  cmb_reservas_bc: 5          # lag medido 1d
  cmb_cambio_contratado: 12   # SGS diario, divulgado na Nota Cambial semanal (ver acima)

# Correcoes por tabela para a checagem de freshness (sync.py), onde o vinculo
# grupo->tabela em `tables:` significa "esta divulgacao e RELEVANTE para esta tabela"
# e nao "esta divulgacao ENTREGA o periodo desta tabela". As duas leituras coincidem
# na maioria dos casos; onde nao coincidem, o resultado seria atraso falso todo mes.
#
# `tables:` fica como esta de proposito -- e a lista de relevancia que o relatorio
# HTML mostra ("o que esta divulgacao alimenta"). O override corrige so a expectativa.
#
# Os tres casos abaixo foram diagnosticados empiricamente em 2026-08-17: cada script
# de ETL foi executado e o MAX(date) da tabela NAO avancou, provando que a fonte nao
# tem dado mais novo -- o atraso era do mapeamento, nao do banco. (No mesmo teste,
# comm_icbr/comm_icbr_usd SIM avancaram: aqueles eram atraso real.)
expectation_overrides:
  cred_credito_familias:
    lag_months: 1
    why: >
      Indicadores de endividamento/comprometimento de renda das familias saem um mes
      ATRAS do resto da nota de credito (dependem de dado de renda). Medido numa
      observacao (2026-08-17: nota cobre 2026-06, tabela para em 2026-05) mais o
      motivo conhecido -- se o lag real for maior, revisar. Um travamento de 2+ meses
      continua sendo detectado, o override desloca a expectativa, nao a desliga.
  cmb_termos_troca:
    expect: none
    why: >
      IPEA/Funcex, nao BCB -- esta sob bcb_external_sector_note por afinidade tematica
      (setor externo), mas tem calendario proprio, nao pesquisado. Precisa do seu
      grupo; ate lah nao da para exigir periodo nenhum.
  expc_focus:
    release_minus_days: 3
    why: >
      Focus e semanal e o feed do BCB nao traz reference_period nenhum, entao sem este
      override a tabela caia na expectativa TRIMESTRAL do bcb_rpm -- e um Focus parado
      passava batido. Foi o que aconteceu de fato em 2026-08-17: a checagem dizia OK
      com MAX(date) em 2026-07-31, e rodar o ETL trouxe 2026-08-14 (duas semanas de
      atraso real, nao detectado). Ancora na DATA da divulgacao em vez do periodo:
      BCB publica na segunda-feira as expectativas coletadas ate a sexta anterior,
      e a coluna `date` da tabela e a data da coleta -- dai os 3 dias.
  expc_focus_periodo:
    release_minus_days: 3
    why: >
      Mesma pesquisa semanal da expc_focus, mesmo raciocinio de ancorar na data da
      coleta -- ver o override dela acima. Sao endpoints diferentes do mesmo Focus
      (periodo de referencia fixo em vez de horizonte movel), nao divulgacoes
      diferentes.
  expc_focus_copom:
    release_minus_days: 3
    why: >
      Idem. Apesar de a tabela ser sobre reunioes do Copom, ela e alimentada pela
      pesquisa Focus semanal, NAO pela reuniao em si -- a expectativa de frescor
      segue o calendario do Focus (semanal), nao o do Copom (a cada 45 dias).
  inflc_meta:
    expect: none
    why: >
      Serie ANUAL: a meta e definida pelo CMN, nao muda a cada RPM trimestral. O
      vinculo com bcb_rpm e de relevancia (o RPM discute a meta), nao de entrega.
      A lista "Reuniões do CMN e COMOC" do BCB e a fonte provavel -- ver Pending no
      CLAUDE.md desta pasta.

# Horario de divulgacao -- `release_time` no grupo, `time` na entrada.
#
# Hora oficial de Brasilia, comparada contra o relogio local da maquina. Nao existe
# conversao de fuso em ponto nenhum: se isto um dia rodar num servidor em UTC, e aqui
# que precisa mudar. Serve para nao cobrar o dado -- nem acender o botao "Atualizar" --
# nas horas entre a meia-noite e o anuncio. Campo OPCIONAL: grupo sem hora se comporta
# como antes, com a divulgacao contando como ocorrida desde o inicio do dia.
#
# `time:` na entrada vence `release_time:` do grupo. Os 10 grupos do BCB tem `time` em
# toda entrada de 2026, escrito por `update_calendar.py --horas` a partir do DTSTART do
# proprio feed ICS (TZID=America/Sao_Paulo, fuso declarado pela fonte). Fica por
# ENTRADA, e nao no grupo, porque a hora muda de era: as notas de estatisticas sairam
# de 10:30 em 2019 para 09:30 e depois 08:30 em 2023. A reuniao do Copom e a excecao
# sem hora -- o feed emite 00:00, que e placeholder de evento de dia inteiro e nao
# meia-noite (a decisao sai perto das 18:30); gravar isso reproduziria exatamente o
# bug que a hora veio corrigir.
#
# `release_time` no grupo e para fonte SEM feed. Os 8 grupos do IBGE estao em 09:00,
# hora padrao do instituto. A API de calendario do IBGE
# (servicodados.ibge.gov.br/api/v3/calendario) tambem tem hora, mas em UTC e sem
# declarar fuso: dos 197 eventos de 2026, 158 dizem 12:00 e 38 dizem 13:00 (mais um
# 12:22:26, que e claramente timestamp de cadastro). O ancoramento e o IPCA, que a API
# poe as 12:00 e o IBGE divulga as 9h -- dai UTC-3. Ou seja: derivado, nao declarado
# pela fonte como no BCB. Corrigir a mao qualquer grupo que se saiba diferente.

groups:
