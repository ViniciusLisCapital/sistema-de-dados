  - group: bls_jolts
    institution: "BLS"
    name: "Job Openings and Labor Turnover Survey (JOLTS)"
    tables: [mt_jolts, mt_jolts_dim]
    cadence: monthly
    # 10:00 e nao 08:30 -- o JOLTS sai mais tarde no dia que o CPI, e a hora esta na
    # coluna "Release Time" da propria agenda do BLS, no fuso da FONTE. Convertida por
    # data pelo sync.py, porque os EUA tem horario de verao e o Brasil nao.
    release_time: "10:00"
    release_time_tz: America/New_York
    note: >
      O JOLTS tem UM MES DE DEFASAGEM A MAIS que o CPI, e isso e a coisa mais
      importante deste grupo: a divulgacao de 01/09/2026 entrega o dado de JULHO,
      enquanto o CPI de 11/09 entrega agosto. Por isso o `reference_period` fica LIDO
      da agenda e nao derivado de "mes anterior ao da divulgacao" -- a regra do
      bls_cpi erraria todas as 13 entradas aqui.
      Datas e horas da pagina de agenda do BLS por release (a unica fonte do BLS com a
      coluna "Reference Month"). Conferidas contra o release 192 do FRED: as duas
      fontes batem exatamente nas 8 datas de 2026 que ambas cobrem, e a de 01/09 e a
      hora de 10:00 batem tambem com o rodape do proprio release em PDF. A agenda do
      BLS cobre so o ano corrente mais o dezembro anterior.
      A tabela de dimensao entra no grupo para o botao rodar a cadeia inteira, mas aqui
      isso e de graca: `mt_jolts.run()` grava as duas no mesmo passe (um download de
      34 MB alimenta valores e arvore), e o `registry` colapsa as duas tabelas num
      script so via `_OVERRIDES` -- o mesmo arranjo do mt_caged_novo.
      Nao ha janela de rotina a escolher: o BLS revisa 5 anos na divulgacao de janeiro
      e os dois ultimos meses todo mes, entao cada passe reescreve a historia inteira.
    source_url: https://www.bls.gov/schedule/news_release/jolts.htm
