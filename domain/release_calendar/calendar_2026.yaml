  - group: bcb_credit_note
    institution: BCB
    name: "Estatísticas Monetárias e de Crédito – Nota para a Imprensa"
    tables:
      - cred_credito_amplo
      - cred_credito_resumo
      - cred_credito_familias
      - cred_inadimplencia_pj
      - cred_modalidade_livre_pj
      - cred_modalidade_livre_pf
      - cred_modalidade_direcionado_pj
      - cred_modalidade_direcionado_pf
      - cred_credito_porte
      - cred_credito_atividade_economica
      - cred_credito_tipo_cliente
      - cred_credito_controle_capital
    cadence: monthly
    note: >
      BCB's own forward calendar page is a JS-rendered SPA, unreachable by fetch tools
      as of 2026-08-13 -- these are estimated windows from the historical pattern
      (business day, ~26th-30th, roughly 4 weeks after month-end), not confirmed dates.
      The note has been pushed past month-end before for unrelated reasons (e.g. the
      2026-06 note moved from 29/06 to 01/07 because of a Brazil World Cup match).
    source_url: https://www.bcb.gov.br/estatisticas/estatisticasmonetariascredito
    entries:
      - {date: "2026-08-26", date_end: "2026-08-30", reference_period: "2026-07", confirmed: false}
      - {date: "2026-09-26", date_end: "2026-09-30", reference_period: "2026-08", confirmed: false}
      - {date: "2026-10-26", date_end: "2026-10-30", reference_period: "2026-09", confirmed: false}
      - {date: "2026-11-26", date_end: "2026-11-30", reference_period: "2026-10", confirmed: false}
      - {date: "2026-12-26", date_end: "2026-12-30", reference_period: "2026-11", confirmed: false, note: "December often shifts earlier for year-end holidays -- treat this window as especially uncertain."}

