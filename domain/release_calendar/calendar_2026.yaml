  - group: bcb_fiscal_statistics
    institution: BCB
    name: "Estatísticas Fiscais – Nota para a Imprensa"
    tables: [fisc_divida, fisc_nfsp]
    cadence: monthly
    note: >
      BCB's forward calendar page returned a genuine HTTP 502 as of 2026-08-13.
      Historical pattern is very regular: last business day of month M+1, covering
      month M data. December is flagged as uncertain since public offices commonly
      shorten hours/close in the last days of the year.
    source_url: https://www.bcb.gov.br/content/estatisticas/hist_estatisticasfiscais/
    entries:
