  - group: bls_empsit
    institution: "BLS"
    name: "The Employment Situation (payroll + household survey)"
    tables: [mt_ces, mt_ces_dim, mt_cps]
    cadence: monthly
    release_time: "08:30"
    release_time_tz: America/New_York
    note: >
      As DUAS pesquisas saem no mesmo release, na primeira sexta-feira do mes seguinte
      ao de referencia -- muito antes do JOLTS, que tem um mes de defasagem a mais: o
      Employment Situation de 07/08/2026 entrega JULHO, e o JOLTS de 01/09 entrega o
      mesmo julho.
      A tabela de dimensao entra no grupo para o botao rodar a cadeia inteira, e aqui
      isso e de graca: `mt_ces.run()` grava `mt_ces` e `mt_ces_dim` no mesmo passe (os
      30 arquivos do FTP alimentam valores e arvore), e o `registry` colapsa as duas
      num script so via `_OVERRIDES`, como no mt_jolts e no mt_caged_novo.
      Duas coisas deste grupo nao se adivinham. A primeira: a CES tem BORDA DIREITA
      IRREGULAR -- a divulgacao de um mes traz os niveis agregados e o detalhe fino vem
      com a divulgacao seguinte, entao no mes mais recente so 27 das 555 folhas da
      arvore tem dado, e um alerta de "dado faltando" no detalhe seria falso alarme.
      A segunda: a CPS **nao tem outubro de 2025** -- a paralisacao do governo cancelou
      a coleta, e o mes nao vai aparecer em revisao nenhuma.
