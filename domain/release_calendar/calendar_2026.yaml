    institution: IBGE
    name: "Pesquisa Industrial Mensal – Produção Física (PIM-PF)"
    tables: [atv_pim, atv_pim_uso]
    cadence: monthly
    source_url: https://www.ibge.gov.br/calendario/conjunturais.html
    entries:
      - {date: "2026-09-02", reference_period: "2026-07", confirmed: true}
      - {date: "2026-10-02", reference_period: "2026-08", confirmed: true}
      - {date: "2026-11-05", reference_period: "2026-09", confirmed: true}
