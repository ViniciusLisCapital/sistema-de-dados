  - group: bls_cpi
    institution: "BLS"
    name: "Consumer Price Index (CPI-U)"
    tables: [inflc_cpi, inflc_cpi_dim]
    cadence: monthly
    # 08:30 na coluna "Release Time" da propria agenda do BLS, declarada no fuso da
    # FONTE: os EUA tem horario de verao e o Brasil nao, entao estas 08:30 sao 09:30
    # em Brasilia de marco a comeco de novembro e 10:30 no resto do ano. Mesma regra
    # do cftc_cot acima -- quem converte por entrada e o sync.py (hora_da_entrada).
    release_time: "08:30"
    release_time_tz: America/New_York
    note: >
      Datas e horas da agenda oficial do BLS (a pagina por release, que e a UNICA
      fonte do BLS com a coluna "Reference Month" -- o feed ICS geral do BLS so tem o
      NOME do release no SUMMARY). Conferidas contra o proprio ICS do BLS e contra o
      release 10 do FRED: as tres fontes batiam exatamente em 2026-08-26. O periodo de
      referencia e sempre o mes anterior ao da divulgacao, mas fica LIDO e nao
      derivado, porque e o que sobrevive a uma agenda irregular (ver bea_pce abaixo,
      onde a regra teria errado 5 divulgacoes seguidas). A agenda do BLS cobre so o
      ano corrente; 2027 nao existia em 2026-08-26.
      A tabela de dimensao entra no grupo porque o botao do calendario precisa rodar a
      cadeia inteira: `inflc_cpi_dim` mede `sa_begin`/`nsa_begin`/`nsa_end` a partir do
      que esta em `inflc_cpi`, entao ela tem que rodar DEPOIS da serie -- e e essa a
      ordem que o registry produz (alfabetica por modulo). `inflc_cpi_pesos` fica de
      fora de proposito: e anual e independente das outras duas, e baixa um xlsx que
      nao muda de mes para mes. A passada de validacao ANTES da serie, que
      `jobs/update_us.py` faz, e a que se perde aqui; ela e redundante numa base ja
      carregada (a arvore nao muda de mes para mes), so nao detecta o BLS mudando a
      indentacao publicada antes de a serie ser gravada.
    source_url: https://www.bls.gov/schedule/news_release/cpi.htm
