    name: "Calendário de Divulgações"
    area: raiz
    output: reports/release_calendar.html
    module: analytics.release_calendar.generate_report
    command: 'uv run python -c "from analytics.release_calendar.generate_report import run; run()"'
    build_seconds: 1
    note: >
      Este relatório. Não lê MySQL na geração — o YAML é a fonte inteira, e o estado
      do banco entra ao vivo pelo serve.py.
    deps:
      - {kind: yaml, ref: domain/release_calendar/calendar_2026.yaml, role: "Datas de divulgação, uma entrada por evento"}
      - {kind: yaml, ref: domain/dashboards/manifest.yaml, role: "Este arquivo — alimenta a aba Status dashboard"}
