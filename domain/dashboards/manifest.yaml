  - key: oraculo
    name: "Oráculo (Power BI)"
    area: brasil
    output: analytics/oraculo/base/Central_base.csv
    module: null
    command: uv run python jobs/update_oraculo.py
    build_seconds: null
    note: >
      Não é HTML: é o CSV que alimenta o Power BI. Entra aqui porque é consumidor de
      banco como qualquer outro relatório e some da vista justamente por não ser um
      arquivo em reports/ — aparece em 8 dos 25 grupos do calendário.
