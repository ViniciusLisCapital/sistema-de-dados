      - {kind: mysql, ref: macro_brasil.mt_caged, role: "Emprego formal"}
      - {kind: mysql, ref: macro_brasil.mt_pnad, role: "Força de trabalho"}
      - {kind: mysql, ref: macro_brasil.cred_credito_amplo, role: "Crédito ampliado"}
      - {kind: mysql, ref: macro_brasil.cred_credito_familias, role: "Condições das famílias"}
      - {kind: mysql, ref: macro_brasil.atv_pib, role: "PIB por setor"}
      - {kind: mysql, ref: macro_brasil.atv_pms, role: "Serviços"}
      - {kind: mysql, ref: macro_brasil.atv_pim, role: "Indústria"}
      - {kind: mysql, ref: macro_brasil.atv_ibcbr, role: "IBC-Br"}

