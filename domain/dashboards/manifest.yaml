# De que cada dashboard depende -- config estatica, uma entrada por relatorio.
#
# Existe para responder a pergunta que nenhuma outra peca do sistema respondia: "este
# relatorio esta olhando para dado velho?". O calendario (domain/release_calendar/)
# sabe QUANDO cada dado sai e o registry (domain/db/registry.py) sabe QUEM escreve
# cada tabela; faltava o outro lado, QUEM LE. Sem isso, apertar "Atualizar" no
# calendario deixava o banco em dia e todo HTML em reports/ parado no dia anterior.
#
# Lido por domain/dashboards/status.py, que resolve o estado ao vivo de cada
# dependencia (MAX(date) no MySQL, ultima linha no CSV, mtime no artefato) e compara
# com o stamp gravado na ultima geracao. A aba "Status dashboard" do relatorio de
# calendario e a vista disso.
#
# -- POR QUE DECLARADO A MAO, E NAO DERIVADO DO CODIGO --
# O registry consegue derivar tabela->script porque todo script de ETL declara
# `_TABLE`. Do lado do consumo nao ha convencao equivalente: cada generate_report.py
# le tabela por caminhos diferentes (MySQLDataRequester direto, _load_flat(),
# pd.read_sql com JOIN, e um caso que le uma tabela de OUTRO projeto). Varrer isso com
# regex daria falso negativo silencioso, que e exatamente o erro que este arquivo
# existe para impedir. Entao e declaracao, e `status.validar()` cobra o que der para
# cobrar: toda tabela declarada tem de existir no banco.
#
# -- CAMPOS --
# key            id estavel; e o que o botao de regerar vai mandar
# name           rotulo na aba
# output         caminho do arquivo gerado, relativo a raiz
# module         modulo com run(output=...). Null quando o entry point nao segue o padrao
# command        linha de comando equivalente (o que a aba mostra no modo arquivo)
# build_seconds  MEDIDO em 2026-08-26 contra o banco real, nao estimado
# deps[].kind    mysql | csv | artifact | live | yaml
# deps[].ref     schema.tabela (mysql) ou caminho relativo a raiz (resto)
# deps[].date_col  coluna de data; `null` = tabela de dimensao, sem serie temporal
# deps[].scope   dados | modelos -- "modelos" so entra com include_models=True (so FX)
# deps[].owner   quando a fonte NAO e alimentada por este projeto
# deps[].refresh como atualizar aquela dependencia, quando nao e o ETL normal

dashboards:
  - key: brasil_economic_activity
    name: "Atividade Econômica"
    area: brasil
    output: reports/brasil/Economic Activity.html
    module: analytics.brasil.economic_activity.generate_report
    command: 'uv run python -c "from analytics.brasil.economic_activity.generate_report import run; run()"'
    build_seconds: 12
    deps:
      - {kind: mysql, ref: macro_brasil.atv_pib, role: "PIB trimestral (aba PIB)"}
      - {kind: mysql, ref: macro_brasil.atv_pib_taxas, role: "Taxas oficiais do IBGE, para conferir a decomposição"}
      - {kind: mysql, ref: macro_brasil.atv_pib_valores_correntes, role: "Peso nominal anual da decomposição de crescimento"}
      - {kind: mysql, ref: macro_brasil.atv_renda_poupanca, role: "Aba Renda e Poupança"}
      - {kind: mysql, ref: macro_brasil.atv_pim, role: "Produção industrial (aba PIM)"}
      - {kind: mysql, ref: macro_brasil.atv_pim_uso, role: "Categorias de uso, mesma aba da PIM"}
      - {kind: mysql, ref: macro_brasil.atv_pmc, role: "Comércio (aba PMC)"}
      - {kind: mysql, ref: macro_brasil.atv_pms, role: "Serviços (aba PMS)"}
      - {kind: mysql, ref: macro_brasil.atv_ibcbr, role: "IBC-Br (aba própria)"}

  - key: brasil_credit
    name: "Crédito"
    area: brasil
    output: reports/brasil/Credit.html
    module: analytics.brasil.credit.generate_report
    command: 'uv run python -c "from analytics.brasil.credit.generate_report import run; run()"'
    build_seconds: 24
    deps:
      - {kind: mysql, ref: macro_brasil.cred_credito_amplo, role: "Crédito ampliado ao setor não financeiro (2ª tabela da aba Saldo)"}
      - {kind: mysql, ref: macro_brasil.cred_credito_resumo, role: "Resumo por recurso × segmento — a espinha das abas Saldo/Concessão/Taxa"}
      - {kind: mysql, ref: macro_brasil.cred_credito_familias, role: "Endividamento e comprometimento de renda das famílias"}
      - {kind: mysql, ref: macro_brasil.cred_inadimplencia_pj, role: "Selic + proxies de estresse PJ"}
      - {kind: mysql, ref: macro_brasil.cred_ptc, role: "Pesquisa Trimestral de Condições de Crédito (aba PTC)"}
      - {kind: mysql, ref: macro_brasil.cred_fluxo_financeiro, role: "Fluxo financeiro e impulso de crédito no conceito do BCB (4ª tabela da aba Impulso)"}
      - {kind: mysql, ref: macro_brasil.cred_modalidade_livre_pj, role: "Modalidades — livre PJ (Saldo, Concessão, Taxa, Inadimplência)"}
      - {kind: mysql, ref: macro_brasil.cred_modalidade_livre_pf, role: "Modalidades — livre PF"}
      - {kind: mysql, ref: macro_brasil.cred_modalidade_direcionado_pj, role: "Modalidades — direcionado PJ"}
      - {kind: mysql, ref: macro_brasil.cred_modalidade_direcionado_pf, role: "Modalidades — direcionado PF"}
      - {kind: mysql, ref: macro_brasil.cred_credito_porte, role: "Porte de empresa (saldo, inadimplência e risco)"}
      - {kind: mysql, ref: macro_brasil.cred_credito_atividade_economica, role: "Atividade econômica (PJ)"}
      - {kind: mysql, ref: macro_brasil.cred_credito_tipo_cliente, role: "Tipo de cliente (aba Saldo)"}
      - {kind: mysql, ref: macro_brasil.cred_credito_controle_capital, role: "Controle de capital — só a métrica de inadimplência é charteada"}
      - {kind: mysql, ref: macro_brasil.inflc_agregados, role: "IPCA, deflator do toggle Nominal/Real"}
      - {kind: mysql, ref: macro_brasil.atv_pib_mensal, role: "PIB acumulado em 12m, denominador do toggle % do PIB"}
      - {kind: mysql, ref: macro_brasil.pm_copom_reuniao, role: "Decisão do Copom por reunião — faixas de ciclo ao fundo dos gráficos da aba Impulso"}

  - key: brasil_fiscal_policy
    name: "Política Fiscal"
    area: brasil
    output: reports/brasil/Fiscal Policy.html
    module: analytics.brasil.fiscal_policy.generate_report
    command: 'uv run python -c "from analytics.brasil.fiscal_policy.generate_report import run; run()"'
    build_seconds: 30
    deps:
      - {kind: mysql, ref: macro_brasil.fisc_efgg, role: "GFSM (aba Receitas e Despesas) + IEG (aba Impulso)"}
      - {kind: mysql, ref: macro_brasil.fisc_rtn, role: "RTN: aba Receitas e Despesas + impulso acima da linha (aba Impulso Fiscal)"}
      - {kind: mysql, ref: macro_brasil.fisc_dlsp_fatores, role: "DLSP e fatores condicionantes (aba Dívida Líquida)"}
      - {kind: mysql, ref: macro_brasil.fisc_investimento, role: "Investimento federal por GND × função/natureza"}
      - {kind: mysql, ref: macro_brasil.fisc_nfsp, role: "Resultado primário, no impulso fiscal"}
      - {kind: mysql, ref: macro_brasil.atv_pib_valores_correntes, role: "PIB nominal trimestral, denominador de % PIB"}
      - {kind: mysql, ref: macro_brasil.atv_pib_mensal, role: "PIB mensal e acumulado 12m, denominador de % PIB"}
      - {kind: mysql, ref: macro_brasil.atv_pib_taxas, role: "Comparação com a taxa oficial do PIB"}
      - {kind: mysql, ref: macro_brasil.inflc_agregados, role: "IPCA, deflator das séries reais"}

  - key: brasil_labor_market
    name: "Mercado de Trabalho"
    area: brasil
    output: reports/brasil/Labor Market.html
    module: analytics.brasil.labor_market.generate_report
    command: 'uv run python -c "from analytics.brasil.labor_market.generate_report import run; run()"'
    build_seconds: 5
    deps:
      - {kind: mysql, ref: macro_brasil.mt_pnad, role: "PNAD mensal (abas Taxas/Ocupação/Rendimento)"}
      - {kind: mysql, ref: macro_brasil.mt_pnad_trimestral, role: "PNAD trimestral, mesmas abas"}
      - {kind: mysql, ref: macro_brasil.mt_caged, role: "CAGED via SGS — estoque, na aba Emprego Formal"}
      - {kind: mysql, ref: macro_brasil.mt_caged_setor, role: "Novo CAGED por setor"}
      - {kind: mysql, ref: macro_brasil.mt_caged_uf, role: "Novo CAGED por UF"}
      - {kind: mysql, ref: macro_brasil.mt_caged_salario, role: "Novo CAGED por faixa salarial"}

  - key: brasil_inflation
    name: "Inflação (BR)"
    area: brasil
    output: reports/brasil/Inflation.html
    module: analytics.brasil.inflation.generate_report
    command: 'uv run python -c "from analytics.brasil.inflation.generate_report import run; run()"'
    build_seconds: 30
    note: >
      Parte das séries deste relatório — os núcleos oficiais e os agregados de IPCA que o Banco
      Central publica — não vem do banco de dados: vem de um arquivo que este dashboard busca por
      conta própria, listado abaixo. O Regerar busca de novo quando esse arquivo está atrás do
      IPCA que já saiu, e só então monta o HTML.
    deps:
      - {kind: mysql, ref: macro_brasil.inflc_decomposicao, role: "IPCA e IPCA-15 por subitem — a base de tudo na aba"}
      - {kind: mysql, ref: macro_brasil.inflc_dim, date_col: null, role: "Dimensão de subitem: grupo, subgrupo e os vetores de núcleo da NT-57"}
      - {kind: mysql, ref: macro_brasil.inflc_decomposicao_item, role: "Nível de item, para Médias Aparadas e Dupla Ponderação"}
      - kind: csv
        ref: analytics/brasil/inflation/data/ipca_bcb_series.csv
        date_col: dt
        role: "Agregados BCB/SGS: headline, componentes e núcleos oficiais"
        refresh: uv run python analytics/brasil/inflation/fetch_bcb.py
        note: >
          Buscado direto no Banco Central, sem passar pelo banco de dados — nenhuma atualização da
          base o alcança. Repete boa parte dos agregados que o banco já tem, e traz uma série que
          não existe lá: o IPCA acumulado em 12 meses.

    # Um passo so, e e um FETCH e nao um calculo: este arquivo e o unico insumo do relatorio que
    # nao vem do MySQL, entao nenhum ETL o move e o botao Atualizar nao o alcanca. Antes disto,
    # ficar atras era invisivel -- e estava: em 2026-09-01 o arquivo tinha ate 2026-07 e a
    # `inflc_decomposicao` ja tinha 2026-08 (o IPCA-15 de agosto), um mes de defasagem que nenhuma
    # tela mostrava. Foi o segundo caso da mesma classe do que motivou a camada em 2026-08-31.
    procedures:
      - id: series_bcb
        label: "Séries agregadas do IPCA (Banco Central)"
        module: analytics.brasil.inflation.fetch_bcb
        call: run
        seconds: 18
        writes:
          - analytics/brasil/inflation/data/ipca_bcb_series.csv
        # O corte e o MAX da coluna `dt` (o dep declara `date_col`), nao o ultimo rotulo do
        # arquivo: este CSV e longo e ordenado por serie, entao a ultima linha e a serie
        # alfabeticamente final, nao o mes mais recente. Casou por sorte quando testado.
        cut_from: analytics/brasil/inflation/data/ipca_bcb_series.csv
        granularidade: mes
        # A fonte real e o SGS do BCB, que nao e dep declarada -- entao a comparacao e contra a
        # tabela que recebe a MESMA divulgacao (IPCA e IPCA-15 por subitem, do IBGE). Medido em
        # 2026-09-01: depois do fetch o arquivo alcanca o mesmo mes da tabela (2026-08), que e o
        # que impede este passo de ficar rodando para sempre a cada Regerar.
        reads:
          - macro_brasil.inflc_decomposicao
        note: >
          Busca no Banco Central as 34 séries agregadas de IPCA que o relatório mostra ao lado da
          decomposição por subitem — headline, livres e monitorados, serviços e industriais, e os
          núcleos oficiais — e recalcula a versão dessazonalizada de 20 delas. É o único insumo
          deste relatório que não vem do banco de dados: sem este passo, o arquivo só andava
          quando alguém rodava o script à mão.

  - key: brasil_expectations
    name: "Expectativas (Focus)"
    area: brasil
    output: reports/brasil/Expectations.html
    module: analytics.brasil.expectations.generate_report
    command: 'uv run python -c "from analytics.brasil.expectations.generate_report import run; run()"'
    build_seconds: 53
    deps:
      - {kind: mysql, ref: macro_brasil.expc_focus, role: "Medianas por indicador e data de pesquisa"}
      - {kind: mysql, ref: macro_brasil.expc_focus_copom, role: "Curva de Selic por reunião do Copom"}
      - {kind: mysql, ref: macro_brasil.expc_focus_periodo, role: "Expectativa por período de referência — 1,1 M de linhas, o loader mais pesado do projeto"}

  - key: brasil_monetary_policy
    name: "Política Monetária"
    area: brasil
    output: reports/brasil/Monetary Policy.html
    module: analytics.brasil.monetary_policy.generate_report
    command: 'uv run python -c "from analytics.brasil.monetary_policy.generate_report import run; run()"'
    build_seconds: 23
    note: >
      Réplica do modelo agregado do Banco Central. Três das quatro abas mostram resultados de um
      modelo que precisa ser estimado antes de o relatório existir — não são consultas ao banco. É
      por isso que este dashboard tem cálculos próprios, listados abaixo: o Regerar refaz os que
      estiverem atrás dos dados e só então monta o HTML, de modo que o modelo que aparece no
      relatório é sempre o modelo rodado com o dado mais recente. A caixa de previsão da aba
      "Projeções do Copom" repete essa conferência dentro do próprio arquivo, para quem abre o
      relatório longe desta página.
    deps:
      # date aqui e o trimestre PROJETADO (vai a 2028), nao quando o dado passou a
      # existir -- por isso a coluna de frescor e a vintage, que e a data da publicacao.
      # Com `date`, a aba anunciaria "ultimo dado 2028-10-01", que nao e leitura de
      # frescor nenhuma.
      - {kind: mysql, ref: macro_brasil.pm_copom_projecoes, date_col: vintage, role: "Projeções do BC (comunicado + RPM), aba Projeções"}
      - {kind: mysql, ref: macro_brasil.pm_copom_reuniao, role: "Decisão de Selic por reunião, aba Projeções"}
      - {kind: mysql, ref: macro_brasil.pm_hiato_produto, date_col: vintage, role: "Hiato publicado no RPM, validação do modelo — vintage é a edição do RPM"}
      # `pm_hiato_produto_vintages` e uma dependencia da PREVISAO, nao da validacao:
      # `hiato_vintage()` le o hiato em t0 como o BC publicou na ultima edicao ANTES do
      # corte, e nao a serie corrente da linha de cima.
      - {kind: mysql, ref: macro_brasil.pm_hiato_produto_vintages, date_col: vintage, role: "Hiato por edição do RPM — é o vintage que a previsão da próxima projeção lê"}
      - {kind: mysql, ref: macro_brasil.inflc_meta, role: "Meta de inflação, a régua do desvio — date é o ANO da meta, então o 'último dado' é o último ano com meta publicada"}
      - {kind: mysql, ref: macro_brasil.inflc_agregados, role: "IPCA e núcleos, aba Condições"}
      - {kind: mysql, ref: macro_brasil.mt_pnad, role: "Taxa de desocupação, aba Condições"}
      - {kind: mysql, ref: macro_brasil.mt_caged, role: "Saldo de emprego formal, aba Condições"}
      - {kind: mysql, ref: macro_brasil.atv_ibcbr, role: "IBC-Br, aba Condições"}
      - {kind: mysql, ref: macro_brasil.expc_focus, role: "Expectativa de IPCA da Focus"}
      - {kind: mysql, ref: macro_brasil.expc_focus_copom, role: "Curva de Selic esperada — entra na eq. (5) e na previsão"}
      - {kind: mysql, ref: macro_brasil.expc_focus_periodo, role: "Expectativa por período; é o delta desta série que prevê a revisão do BC"}
      - {kind: mysql, ref: macro_brasil.cmb_ptax, role: "Câmbio, aba Condições"}
      - {kind: mysql, ref: macro_brasil.comm_icbr, role: "Índice de commodities Brasil, aba Condições"}
      - {kind: mysql, ref: macro_international.comm_brent, role: "Brent, aba Condições"}
      - {kind: yaml, ref: domain/release_calendar/calendar_2026.yaml, role: "Datas de divulgação — é o que decide o que o Copom tinha na mesa em cada reunião"}
      - {kind: artifact, ref: analytics/brasil/monetary_policy/data/modelo_painel_full.csv, role: "Painel trimestral estimado", refresh: uv run python analytics/brasil/monetary_policy/modelo_painel.py}
      # Escalar, sem data interna -- entra por causa do `faltando`: sem ele a estimacao para,
      # e a linha "1 arquivo ainda nao existe" e o unico aviso possivel.
      - {kind: artifact, ref: analytics/brasil/monetary_policy/data/modelo_sigma_rr.txt, date_col: null, role: "Escala do choque da taxa neutra, calibrada pelos painéis e lida na estimação"}
      - {kind: artifact, ref: analytics/brasil/monetary_policy/data/modelo_estados.csv, role: "Estados latentes do modelo", refresh: uv run python analytics/brasil/monetary_policy/modelo_agregado.py}
      - {kind: artifact, ref: analytics/brasil/monetary_policy/data/modelo_estados_est.csv, role: "Estados com parâmetros estimados"}
      - {kind: artifact, ref: analytics/brasil/monetary_policy/data/modelo_cenario_focus__eq5.csv, role: "Curva de Selic da Focus que o motor JS carrega"}
      - {kind: artifact, ref: analytics/brasil/monetary_policy/data/modelo_neutra_pub.csv, role: "Taxa neutra publicada pelo BC"}
      - {kind: artifact, ref: analytics/brasil/monetary_policy/data/modelo_params.json, role: "Parâmetros do motor portado para o navegador"}
      - {kind: artifact, ref: analytics/brasil/monetary_policy/data/modelo_eq5_diag.json, role: "Raio espectral do laço da eq. (5)"}
      - {kind: artifact, ref: analytics/brasil/monetary_policy/data/modelo_validacao.csv, role: "Tabela de validação do Apêndice"}
      - {kind: artifact, ref: analytics/brasil/monetary_policy/data/modelo_validacao_irf.json, role: "IRF contra o do BC, Apêndice"}
      - kind: artifact
        ref: analytics/brasil/monetary_policy/data/antecipa_backtest.csv
        role: "Backtest dos 3 métodos de previsão, aba Projeções"
        refresh: 'uv run python -c "from analytics.brasil.monetary_policy.antecipa_copom import salvar; salvar()"'
      - kind: artifact
        ref: analytics/brasil/monetary_policy/data/antecipa_previsao.json
        role: "Previsão da próxima projeção do BC"
        # O frescor deste artefato NAO e o mtime: o que importa e o conjunto de
        # informacao com que ele foi calculado, que ele mesmo grava em `corte_usado`.
        # Um salvar() rodado hoje contra o Focus de anteontem tem mtime de hoje.
        json_date: corte_usado
        refresh: 'uv run python -c "from analytics.brasil.monetary_policy.antecipa_copom import salvar; salvar()"'
        note: >
          Guarda, junto com a previsão, a data do último dado usado para calculá-la. É essa data
          que diz se a previsão está em dia: a data do arquivo não serve, porque um cálculo feito
          hoje com dado de anteontem tem arquivo de hoje.

    # ── Procedimentos: o que o botao Regerar recalcula ANTES de gerar o HTML ─────
    # Sao DOIS botoes no sistema, e so dois: "Atualizar" (aba Divulgacoes) mexe na base
    # de dados, e "Regerar" (aba Status dashboard) reconstroi o dashboard -- e reconstruir
    # inclui refazer o que estiver atras. Cada procedimento e um passo de recalculo:
    # `{id, label, module, call, seconds, writes[], cut_from, reads[], granularidade}`.
    # `module` + `call` sao importados, como o `module` + run() do dashboard, entao a
    # pagina manda um id e quem resolve id -> funcao e o nosso lado. Sem shell.
    #
    # A ORDEM da lista e a ordem de execucao, e `gerar()` reavalia a cada passo -- entao
    # `painel` ganhar um trimestre novo poe `modelo` atras na mesma rodada, em cascata.
    #
    # `writes` liga o procedimento aos artefatos (e nao o contrario): `salvar()` grava
    # dois arquivos e `rodar()` sete, e declarado do lado do dep a mesma rodada apareceria
    # duas e sete vezes.
    #
    # ## O que decide se um passo esta atras
    #
    # `cut_from` e o artefato que carrega o CORTE do proprio procedimento, `reads` sao as
    # fontes dele, e `granularidade` e a unidade em que os dois se comparam. Isso existe
    # porque um artefato calculado tem DUAS datas e so uma era observavel: quando foi
    # escrito (mtime) e com que dado (o corte). Um `salvar()` rodado hoje contra o Focus
    # de anteontem tem mtime de hoje -- foi o que passou por "em dia" em 2026-08-31.
    #
    # A granularidade nao e detalhe: e o que da a cada passo a frequencia dele. O painel e
    # trimestral, entao o corte dele e o ultimo trimestre do CSV e ele so fica atras quando
    # um trimestre NOVO abre -- uma vez por trimestre, nao todo dia que a Focus anda. A
    # previsao e diaria, e fica atras assim que a pesquisa anda. Sem isso, a estimacao do
    # modelo seria refeita a cada boletim, mudando os 22 parametros por nada.
    procedures:
      - id: painel
        label: "Painéis trimestrais"
        module: analytics.brasil.monetary_policy.modelo_painel
        call: construir_tudo
        seconds: 90
        writes:
          - analytics/brasil/monetary_policy/data/modelo_painel_full.csv
          - analytics/brasil/monetary_policy/data/modelo_neutra_pub.csv
          - analytics/brasil/monetary_policy/data/modelo_sigma_rr.txt

        # O corte do painel é o último trimestre que ele tem, que é o próprio índice do
        # CSV. Comparado em TRIMESTRE contra as fontes: só fica atrás quando um trimestre
        # novo abre, não a cada boletim Focus.
        cut_from: analytics/brasil/monetary_policy/data/modelo_painel_full.csv
        granularidade: trimestre
        reads:
          - macro_brasil.atv_ibcbr
          - macro_brasil.inflc_agregados
          - macro_brasil.inflc_meta
          - macro_brasil.expc_focus
          - macro_brasil.expc_focus_periodo
          - macro_brasil.cmb_ptax
          - macro_brasil.comm_icbr
          - macro_brasil.mt_caged
        note: >
          Monta a base trimestral que o modelo estima — hiato do produto, juro real, inflação,
          câmbio e commodities numa mesma tabela — e a taxa de juro neutra que o Banco Central
          publica. É o insumo do passo seguinte: refazer isto muda tudo o que vem depois.
      - id: modelo
        label: "Estimação do modelo agregado"
        module: analytics.brasil.monetary_policy.modelo_agregado
        call: rodar
        seconds: 240
        writes:
          - analytics/brasil/monetary_policy/data/modelo_estados.csv
          - analytics/brasil/monetary_policy/data/modelo_estados_est.csv
          - analytics/brasil/monetary_policy/data/modelo_params.json
          - analytics/brasil/monetary_policy/data/modelo_cenario_focus__eq5.csv
          - analytics/brasil/monetary_policy/data/modelo_eq5_diag.json
          - analytics/brasil/monetary_policy/data/modelo_validacao.csv
          - analytics/brasil/monetary_policy/data/modelo_validacao_irf.json
        # A fonte deste passo é o PAINEL, não o banco — `reads` aceita artefato pelo mesmo
        # motivo que aceita tabela: o que importa é "o que eu leio andou depois de mim?".
        # É isso que faz a cascata: painel ganha trimestre -> modelo fica atrás.
        cut_from: analytics/brasil/monetary_policy/data/modelo_estados.csv
        granularidade: trimestre
        reads:
          - analytics/brasil/monetary_policy/data/modelo_painel_full.csv
        note: >
          Estima o modelo sobre essa base: os parâmetros das equações, as duas séries que não se
          observam (o hiato do produto e a taxa de juro neutra) e a comparação com os valores que
          o Banco Central publicou. É o que abastece o simulador de cenários da primeira aba e a
          tabela de validação do Apêndice.
      - id: previsao
        label: "Previsão da próxima projeção do BC + backtest"
        module: analytics.brasil.monetary_policy.antecipa_copom
        call: salvar
        seconds: 55
        writes:
          - analytics/brasil/monetary_policy/data/antecipa_backtest.csv
          - analytics/brasil/monetary_policy/data/antecipa_previsao.json
        cut_from: analytics/brasil/monetary_policy/data/antecipa_previsao.json
        # Diária: as fontes são a pesquisa Focus e a PTAX, e a previsão fica atrás assim
        # que uma delas anda. É o passo que roda com mais frequência, e o mais barato.
        granularidade: dia
        reads:
          - macro_brasil.expc_focus_periodo
          - macro_brasil.expc_focus_copom
          - macro_brasil.pm_copom_projecoes
          - macro_brasil.pm_copom_reuniao
          - macro_brasil.pm_hiato_produto_vintages
          - macro_brasil.cmb_ptax
        note: >
          Calcula que número o Copom deve publicar para a inflação no horizonte relevante na
          próxima reunião, e refaz o backtest dos três métodos nas reuniões passadas. É
          o losango no fim da série e a tabela de erros da aba "Projeções do Copom". Depende da
          pesquisa Focus, que anda toda semana, então é o cálculo que fica atrás dos dados mais
          rápido — e o mais barato de refazer.

  - key: brasil_exchange_rate
    name: "Câmbio"
    area: brasil
    output: reports/brasil/FX Report.html
    module: analytics.brasil.exchange_rate.generate_report
    command: 'uv run python -c "from analytics.brasil.exchange_rate.generate_report import run; run()"'
    build_seconds: 43
    note: >
      As três abas de modelo (PPP, Atribuição e Ridge) podem ser puladas na geração: sem elas o
      relatório sai em poucos segundos e não busca nada em fonte externa. As dependências marcadas
      como "modelos" só valem quando essas abas entram.
    deps:
      - {kind: mysql, ref: macro_brasil.cmb_ptax, role: "PTAX e volume interbancário"}
      - {kind: mysql, ref: macro_brasil.cmb_reservas_bc, role: "Reservas e posicionamento do BC"}
      - {kind: mysql, ref: macro_brasil.cmb_fluxo_cambial, role: "Fluxo cambial"}
      - {kind: mysql, ref: macro_brasil.cmb_balanco_pagmt, role: "Balanço de pagamentos"}
      - {kind: mysql, ref: macro_brasil.cmb_comex_pais, role: "Comex Stat por país"}
      - {kind: mysql, ref: macro_brasil.cmb_comex_fator_agregado, role: "Comex Stat por fator agregado"}
      - {kind: mysql, ref: macro_brasil.cmb_comex_produto, role: "Comex Stat por produto"}
      - {kind: mysql, ref: macro_brasil.cmb_termos_troca, role: "Termos de troca (Funcex/IPEA)"}
      - {kind: mysql, ref: macro_brasil.atv_pib_usd, role: "PIB em USD, normalizador do BOP"}
      - {kind: mysql, ref: macro_international.diferenciais_juros, role: "Diferenciais de juros Brasil × EUA"}
      - {kind: mysql, ref: macro_international.cmb_reer, role: "REER do BIS"}
      - {kind: mysql, ref: macro_international.cmb_cot_fx, role: "Posicionamento especulativo CFTC"}
      - {kind: mysql, ref: macro_brasil.inflc_agregados, scope: modelos, role: "IPCA, o deflator brasileiro do PPP"}
      - {kind: mysql, ref: macro_brasil.inflc_meta, scope: modelos, role: "Meta de inflação, no núcleo PPP — date é o ANO da meta"}
      - {kind: mysql, ref: macro_brasil.cmb_risco_pais, scope: modelos, role: "CDS 5Y, canal fiscal do Ridge", refresh: "CSV exportado à mão do investing.com — não automatiza"}
      - {kind: mysql, ref: macro_brasil.comm_icbr_usd, scope: modelos, role: "Commodities em USD, canal de termos de troca"}
      - {kind: mysql, ref: macro_international.cmb_dollar_index, scope: modelos, role: "DXY"}
      - {kind: mysql, ref: macro_international.cmb_dollar_index_em, scope: modelos, role: "Dólar contra EM"}
      - {kind: mysql, ref: macro_international.cmb_equity_us, scope: modelos, role: "S&P 500"}
      - {kind: mysql, ref: macro_international.cmb_fx_latam, scope: modelos, role: "Câmbio MX/CL/CO/PE, comparação regional"}
      - {kind: mysql, ref: macro_international.cmb_policy_rates, scope: modelos, role: "Policy rates do BIS"}
      - kind: mysql
        ref: base_mercado.interest_rates
        scope: modelos
        owner: CentralManagement
        role: "Curvas de juros (breakeven, inclinação, juro real) do núcleo PPP"
        note: >
          Única dependência fora dos schemas macro_*. Quem escreve é o projeto
          CentralManagement, pela tarefa agendada "Atualizacao da base de dados"
          (09:30 diário) — não há nada neste repositório que a atualize.
      - kind: live
        ref: FRED:CPIAUCSL
        scope: modelos
        role: "CPI dos EUA, o outro lado do PPP"
        note: Buscado no FRED durante a geração; não passa pelo MySQL.
      - kind: live
        ref: FRED:DFII10
        scope: modelos
        role: "Juro real de 10 anos dos EUA, regressor do Ridge"
        note: Buscado no FRED durante a geração; não passa pelo MySQL.
      # Os dois arquivos do modelo Ridge que a GERACAO le e nunca reescreve. Ficaram sem
      # declaracao ate 2026-09-01: eram o caso classico de artefato calculado cujo atraso nao
      # aparecia em tela nenhuma. Entram como DEPENDENCIA e nao como `procedures`, e a razao e
      # diferente em cada um -- ver as notas. Nenhum dos dois tem calendario proprio: os dois
      # andam quando alguem decide reestimar o modelo.
      - kind: artifact
        ref: analytics/brasil/exchange_rate/models/ridge_results/model_fit_cutoff.json
        scope: modelos
        role: "Mês até onde os coeficientes do Ridge são estimados"
        json_date: cutoff_month
        refresh: 'uv run python -c "from analytics.brasil.exchange_rate.models.ridge_deviation_model import refit_from_latest_data; refit_from_latest_data(force=True)"'
        note: >
          O ajuste do modelo está fixado neste mês de propósito: regerar o relatório traz dado
          novo para os gráficos, mas não reestima os coeficientes. Avançar o mês é uma decisão de
          quem cuida do modelo — normalmente quando todos os canais já têm o mesmo mês —, não uma
          consequência de ter saído dado novo, e é por isso que o Regerar não mexe aqui.
      - kind: artifact
        ref: analytics/brasil/exchange_rate/models/ridge_results/forecast_error_bands_w72.json
        scope: modelos
        role: "Largura da banda de erro da projeção, por mês à frente"
        refresh: 'uv run python -c "from analytics.brasil.exchange_rate.models.ridge_deviation_model import forecast_error_bands_w72; forecast_error_bands_w72(force=True)"'
        note: >
          Calculada de uma vez e guardada em arquivo — são 139 reajustes do modelo ao longo da
          amostra, cerca de um minuto e meio. Refazer vem junto com a reestimação do modelo, não
          com o dado novo do mês: a banda é uma estatística de erro da amostra inteira, e não
          muda de forma por causa de um mês a mais.
      - kind: csv
        ref: analytics/brasil/exchange_rate/models/fx_attribution_data/verde_asset/claims.csv

        date_col: date
        scope: modelos
        role: "Atribuição cambial — cartas da Verde, extraídas à mão"
        refresh: extração manual a partir dos PDFs
      - kind: csv
        ref: analytics/brasil/exchange_rate/models/fx_attribution_data/kinea/claims.csv
        date_col: date
        scope: modelos
        role: "Atribuição cambial — Kinea, extraída à mão"
        refresh: extração manual a partir dos PDFs
      - kind: csv
        ref: analytics/brasil/exchange_rate/models/fx_attribution_data/kapitalo/claims.csv
        date_col: date
        scope: modelos
        role: "Atribuição cambial — Kapitalo, extraída à mão"
        refresh: extração manual a partir dos PDFs

  - key: us_inflation
    name: "Inflation (US)"
    area: us
    output: reports/us/Inflation.html
    module: analytics.us.inflation.generate_report
    command: 'uv run python -c "from analytics.us.inflation.generate_report import run; run()"'
    build_seconds: 13
    deps:
      - {kind: mysql, ref: macro_us.inflc_cpi, role: "Níveis do CPI-U por item"}
      - {kind: mysql, ref: macro_us.inflc_cpi_dim, date_col: null, role: "As duas árvores do CPI (despesa e Tabela 1)"}
      - {kind: mysql, ref: macro_us.inflc_cpi_pesos, date_col: reference_period, role: "Relative importance anual"}
      - {kind: mysql, ref: macro_us.inflc_pce, role: "Índice de preço e despesa nominal do PCE"}
      - {kind: mysql, ref: macro_us.inflc_pce_dim, date_col: null, role: "Árvore do PCE, com os sinais de subtração"}
      - {kind: yaml, ref: domain/release_calendar/calendar_2026.yaml, role: "Datas e horas de divulgação do CPI (BLS) e do PCE (BEA) — a faixa no topo da página"}

  - key: us_labor_market
    name: "Labor Market (US)"
    area: us
    output: reports/us/Labor Market.html
    module: analytics.us.labor_market.generate_report
    command: 'uv run python -c "from analytics.us.labor_market.generate_report import run; run()"'
    build_seconds: 95
    note: >
      Mercado de trabalho dos EUA, com as três pesquisas mensais do BLS na mesma página.
      O payroll (pesquisa de estabelecimentos) traz emprego por 839 indústrias mais horas
      e ganhos; a pesquisa domiciliar traz desemprego, participação, duração e as seis
      medidas de subutilização; e o JOLTS traz vagas abertas e rotatividade por indústria,
      tamanho de estabelecimento e região. A aba de derivadas é a única que calcula algo:
      vagas por desempregado, contratação líquida, curva de Beveridge e a divergência
      entre as duas medidas de emprego.
      As dependências de cada pesquisa vêm do mesmo download, então andam juntas: um passe
      do CES escreve tabela e árvore, e o mesmo vale para o JOLTS.
    deps:
      - {kind: mysql, ref: macro_us.mt_jolts, role: "Vagas, contratações e separações por indústria, tamanho de estabelecimento e região"}
      - {kind: mysql, ref: macro_us.mt_jolts_dim, date_col: null, role: "As três árvores do release (raízes diferentes: Total nonfarm, Total private, Total US)"}
      - {kind: mysql, ref: macro_us.mt_ces, role: "Emprego, horas e ganhos por indústria — o payroll do Employment Situation"}
      - {kind: mysql, ref: macro_us.mt_ces_dim, date_col: null, role: "A árvore de 839 indústrias da CES, com a cobertura dos filhos em cada nó"}
      - {kind: mysql, ref: macro_us.mt_cps, role: "Manchetes da pesquisa domiciliar: desemprego, participação, duração, U-1 a U-6"}

